name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  build-image:
    needs: [lint-test]
    # Disabled for now: only the quality-check pipeline runs. Set the repository
    # variable ENABLE_DEPLOY=true to enable image publishing and deployment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Woodpecker deploy pipeline
        run: |
          REPO_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.WOODPECKER_TOKEN }}" \
            "${{ secrets.WOODPECKER_URL }}/api/repos/lookup/${{ github.repository }}" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WOODPECKER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}' \
            "${{ secrets.WOODPECKER_URL }}/api/repos/${REPO_ID}/pipelines"
