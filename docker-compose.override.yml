services:
  app:
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://bims_shopify:bims_shopify@postgres:5432/bims_shopify
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-to-a-random-secret}
      FERNET_KEY: ${FERNET_KEY:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: development
    env_file: []
    networks:
      - internal
    labels: []

  postgres:
    ports:
      - "5434:5432"
    networks:
      - internal

networks:
  internal:
    internal: false
  traefik_web:
    external: false
